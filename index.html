<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Habit Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--green1:#0e4429;--green2:#006d32;--green3:#26a641;--green4:#39d353}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 80px}
.container{max-width:800px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;flex-wrap:wrap;gap:8px}
header h1{font-size:1.4rem;display:flex;align-items:center;gap:8px}
.header-actions{display:flex;gap:8px}
button{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 14px;cursor:pointer;font-size:.85rem;transition:all .2s}
button:hover{background:var(--border)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{opacity:.85}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 16px;color:var(--text2);font-weight:500}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}

/* Today View */
.today-header{margin-bottom:16px}
.today-header h2{font-size:1.1rem;color:var(--text2);font-weight:400}
.today-header .date{font-size:1.6rem;font-weight:700}
.habit-list{display:flex;flex-direction:column;gap:8px}
.habit-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.habit-card:active{transform:scale(.97)}
.habit-card.done{border-color:var(--green3)}
.habit-card.done .check{background:var(--green3);border-color:var(--green3)}
.habit-card.done .check::after{content:'✓';color:#fff;font-size:14px}
.habit-card .emoji{font-size:1.6rem}
.habit-card .info{flex:1}
.habit-card .info .name{font-weight:600;font-size:.95rem}
.habit-card .info .streak{font-size:.8rem;color:var(--text2);margin-top:2px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0}
.ripple{position:absolute;border-radius:50%;background:rgba(57,211,83,.3);transform:scale(0);animation:ripple .6s ease-out}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.habit-card.pop{animation:pop .3s ease}

/* Heatmap */
.heatmap-section{margin-top:16px}
.heatmap-section h3{margin-bottom:12px;font-size:1rem}
.heatmap-wrapper{overflow-x:auto;padding-bottom:8px}
.heatmap{display:flex;gap:3px}
.heatmap-col{display:flex;flex-direction:column;gap:3px}
.heatmap-cell{width:13px;height:13px;border-radius:2px;background:var(--surface2);transition:background .2s}
.heatmap-cell[data-level="1"]{background:var(--green1)}
.heatmap-cell[data-level="2"]{background:var(--green2)}
.heatmap-cell[data-level="3"]{background:var(--green3)}
.heatmap-cell[data-level="4"]{background:var(--green4)}
.heatmap-months{display:flex;font-size:.7rem;color:var(--text2);margin-bottom:4px}
.heatmap-legend{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:.75rem;color:var(--text2)}
.heatmap-legend .cell{width:13px;height:13px;border-radius:2px}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
.stat-card .value{font-size:1.8rem;font-weight:700}
.stat-card .label{font-size:.8rem;color:var(--text2);margin-top:4px}
.habit-stats{margin-top:16px}
.habit-stat-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.habit-stat-row .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.habit-stat-row .top .name{font-weight:600}
.progress-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-bar .fill{height:100%;border-radius:3px;transition:width .5s}
.milestone{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:12px;padding:4px 10px;font-size:.75rem;margin:2px}
.milestone.achieved{background:var(--green1);color:var(--green4)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:16px 16px 0 0;padding:24px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.modal h2{margin-bottom:16px;font-size:1.2rem}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px}
.form-group input,.form-group select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);font-size:.95rem}
.color-options{display:flex;gap:8px;flex-wrap:wrap}
.color-opt{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s}
.color-opt.selected{border-color:#fff;transform:scale(1.15)}
.emoji-picker{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow-y:auto}
.emoji-opt{font-size:1.5rem;cursor:pointer;padding:4px;border-radius:6px;transition:background .2s}
.emoji-opt:hover{background:var(--surface2)}
.emoji-opt.selected{background:var(--border)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1}

/* Fab */
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:1.8rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:50}

/* Import/Export */
.io-section{margin-top:16px}
.io-section button{margin-right:8px;margin-bottom:8px}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty .icon{font-size:3rem;margin-bottom:12px}

/* Tooltip */
.tooltip{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:.75rem;color:var(--text);pointer-events:none;z-index:200;white-space:nowrap}

/* Delete */
.delete-btn{background:none;border:none;color:var(--text2);padding:4px 8px;font-size:.8rem}
.delete-btn:hover{color:#f85149}

@media(min-width:600px){
  .modal-overlay{align-items:center}
  .modal{border-radius:16px;margin:20px}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎯 Habit Tracker</h1>
    <div class="header-actions">
      <button onclick="exportData()">Export</button>
      <button onclick="document.getElementById('importFile').click()">Import</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="today" onclick="switchTab('today')">Today</button>
    <button class="tab" data-tab="heatmap" onclick="switchTab('heatmap')">Heatmap</button>
    <button class="tab" data-tab="stats" onclick="switchTab('stats')">Stats</button>
  </div>

  <div id="tab-today" class="tab-content">
    <div class="today-header">
      <div class="date" id="todayDate"></div>
      <h2 id="todaySubtext"></h2>
    </div>
    <div class="habit-list" id="habitList"></div>
  </div>

  <div id="tab-heatmap" class="tab-content" style="display:none">
    <div id="heatmapContainer"></div>
  </div>

  <div id="tab-stats" class="tab-content" style="display:none">
    <div id="statsContainer"></div>
  </div>
</div>

<button class="fab" onclick="openAddModal()">+</button>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">Add Habit</h2>
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="habitName" placeholder="e.g. Morning Run" maxlength="30">
    </div>
    <div class="form-group">
      <label>Icon</label>
      <div class="emoji-picker" id="emojiPicker"></div>
    </div>
    <div class="form-group">
      <label>Color</label>
      <div class="color-options" id="colorPicker"></div>
    </div>
    <div class="form-group">
      <label>Frequency</label>
      <select id="habitFreq">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
      </select>
    </div>
    <div class="modal-actions">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveHabit()">Save</button>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip" style="display:none"></div>

<script>
const EMOJIS=['💪','🏃','📚','💧','🧘','✍️','🎨','🎵','💤','🥗','🧠','💊','🌅','🚶','🧹','💰','📱','🍎','☕','🔥','⭐','🎯','💎','🌿','🏋️','🚴','🧘‍♂️','📝','🎸','🌙'];
const COLORS=['#39d353','#58a6ff','#f778ba','#d29922','#f85149','#a371f7','#3fb950','#79c0ff','#ff7b72','#e3b341'];
const MILESTONES=[{d:7,l:'🔥 1 Week'},{d:30,l:'⭐ 1 Month'},{d:100,l:'💎 100 Days'},{d:365,l:'👑 1 Year'}];

let data={habits:[],completions:{}};
let editId=null;
let selectedEmoji='💪';
let selectedColor=COLORS[0];

function load(){try{const s=localStorage.getItem('habits-data');if(s)data=JSON.parse(s)}catch(e){}}
function save(){localStorage.setItem('habits-data',JSON.stringify(data))}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}

function switchTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.querySelectorAll('.tab-content').forEach(c=>c.style.display='none');
  document.getElementById('tab-'+t).style.display='block';
  if(t==='heatmap')renderHeatmap();
  if(t==='stats')renderStats();
}

function renderToday(){
  const d=today();
  document.getElementById('todayDate').textContent=fmt(d);
  const doneCount=data.habits.filter(h=>isCompletedOn(h.id,d)).length;
  const total=data.habits.filter(h=>isDue(h,d)).length;
  document.getElementById('todaySubtext').textContent=total?`${doneCount}/${total} completed`:'Add your first habit →';
  const list=document.getElementById('habitList');
  if(!data.habits.length){list.innerHTML='<div class="empty"><div class="icon">🎯</div><div>No habits yet. Tap + to add one!</div></div>';return}
  list.innerHTML=data.habits.filter(h=>isDue(h,d)).map(h=>{
    const done=isCompletedOn(h.id,d);
    const streak=getStreak(h.id);
    return`<div class="habit-card${done?' done':''}" onclick="toggleHabit('${h.id}')" style="--hc:${h.color}">
      <span class="emoji">${h.emoji}</span>
      <div class="info">
        <div class="name">${esc(h.name)}</div>
        <div class="streak">${streak?'🔥 '+streak+' day streak':'Start your streak!'}</div>
      </div>
      <div class="check" style="${done?'background:'+h.color+';border-color:'+h.color:''}"><span style="color:#fff">${done?'✓':''}</span></div>
      <button class="delete-btn" onclick="event.stopPropagation();deleteHabit('${h.id}')">×</button>
    </div>`}).join('');
}

function isDue(h,d){
  if(h.frequency==='daily')return true;
  // weekly: due every day but show completion for the week
  return true;
}

function isCompletedOn(id,d){return(data.completions[id]||[]).includes(d)}

function toggleHabit(id){
  const d=today();
  if(!data.completions[id])data.completions[id]=[];
  const arr=data.completions[id];
  const i=arr.indexOf(d);
  if(i>=0)arr.splice(i,1);else arr.push(d);
  save();renderToday();
  // animate
  const cards=document.querySelectorAll('.habit-card');
  cards.forEach(c=>{if(c.onclick.toString().includes(id)){c.classList.add('pop');setTimeout(()=>c.classList.remove('pop'),300)}});
  // check milestones
  if(i<0){const s=getStreak(id);const m=MILESTONES.find(m=>m.d===s);if(m)showMilestone(m.l,id)}
}

function showMilestone(label){
  const el=document.createElement('div');
  el.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:var(--surface);border:2px solid var(--green3);border-radius:16px;padding:24px 32px;text-align:center;font-size:1.3rem;z-index:300;transition:transform .4s cubic-bezier(.34,1.56,.64,1)';
  el.textContent=label+'!';
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.style.transform='translate(-50%,-50%) scale(1)');
  setTimeout(()=>{el.style.transform='translate(-50%,-50%) scale(0)';setTimeout(()=>el.remove(),400)},2000);
}

function getStreak(id){
  const comp=data.completions[id]||[];
  if(!comp.length)return 0;
  const sorted=[...comp].sort().reverse();
  const t=today();
  if(sorted[0]!==t){const y=dayBefore(t);if(sorted[0]!==y)return 0}
  let streak=1;let cur=sorted[0];
  for(let i=1;i<sorted.length;i++){const prev=dayBefore(cur);if(sorted[i]===prev){streak++;cur=prev}else break}
  return streak;
}

function getLongestStreak(id){
  const comp=data.completions[id]||[];
  if(!comp.length)return 0;
  const sorted=[...comp].sort();
  let max=1,cur=1;
  for(let i=1;i<sorted.length;i++){if(sorted[i]===nextDay(sorted[i-1]))cur++;else cur=1;if(cur>max)max=cur}
  return max;
}

function dayBefore(d){const dt=new Date(d+'T12:00:00');dt.setDate(dt.getDate()-1);return dt.toISOString().slice(0,10)}
function nextDay(d){const dt=new Date(d+'T12:00:00');dt.setDate(dt.getDate()+1);return dt.toISOString().slice(0,10)}

function renderHeatmap(){
  const container=document.getElementById('heatmapContainer');
  if(!data.habits.length){container.innerHTML='<div class="empty"><div class="icon">📊</div>Add habits to see your heatmap</div>';return}
  let html='<h3>Last 365 Days</h3>';
  data.habits.forEach(h=>{
    html+=`<div style="margin-bottom:24px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span>${h.emoji}</span><strong>${esc(h.name)}</strong></div>`;
    html+=buildHeatmap(h);
    html+='</div>';
  });
  // Overall
  html+='<div style="margin-bottom:24px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span>📊</span><strong>Overall</strong></div>';
  html+=buildOverallHeatmap();
  html+='</div>';
  html+=`<div class="heatmap-legend"><span>Less</span><div class="cell" style="background:var(--surface2)"></div><div class="cell" style="background:var(--green1)"></div><div class="cell" style="background:var(--green2)"></div><div class="cell" style="background:var(--green3)"></div><div class="cell" style="background:var(--green4)"></div><span>More</span></div>`;
  container.innerHTML=html;
  addTooltips();
}

function buildHeatmap(h){
  const comp=new Set(data.completions[h.id]||[]);
  return buildGrid(d=>comp.has(d)?4:0,h.color);
}

function buildOverallHeatmap(){
  const total=data.habits.length;
  return buildGrid(d=>{
    if(!total)return 0;
    let c=0;data.habits.forEach(h=>{if((data.completions[h.id]||[]).includes(d))c++});
    const pct=c/total;
    if(pct===0)return 0;if(pct<=.25)return 1;if(pct<=.5)return 2;if(pct<=.75)return 3;return 4;
  });
}

function buildGrid(levelFn,color){
  const end=new Date();const start=new Date();start.setDate(end.getDate()-364);
  // Align to Sunday
  while(start.getDay()!==0)start.setDate(start.getDate()-1);
  let html='<div class="heatmap-wrapper"><div class="heatmap">';
  const cur=new Date(start);
  while(cur<=end||cur.getDay()!==0){
    html+='<div class="heatmap-col">';
    for(let r=0;r<7;r++){
      const ds=cur.toISOString().slice(0,10);
      const lv=cur<=end?levelFn(ds):0;
      const style=color&&lv>0?`background:${color};opacity:${lv*0.25}`:'';
      html+=`<div class="heatmap-cell" data-level="${lv}" data-date="${ds}" ${style?'style="'+style+'"':''}></div>`;
      cur.setDate(cur.getDate()+1);
    }
    html+='</div>';
  }
  html+='</div></div>';
  return html;
}

function addTooltips(){
  const tip=document.getElementById('tooltip');
  document.querySelectorAll('.heatmap-cell').forEach(c=>{
    c.addEventListener('mouseenter',e=>{
      const d=c.dataset.date;if(!d)return;
      const lv=c.dataset.level;
      tip.textContent=`${d} — ${lv>0?'completed':'no activity'}`;
      tip.style.display='block';
      tip.style.left=e.pageX+10+'px';tip.style.top=e.pageY-30+'px';
    });
    c.addEventListener('mouseleave',()=>tip.style.display='none');
  });
}

function renderStats(){
  const container=document.getElementById('statsContainer');
  if(!data.habits.length){container.innerHTML='<div class="empty"><div class="icon">📈</div>Add habits to see stats</div>';return}
  const t=today();
  const allComp=Object.values(data.completions).flat();
  const uniqueDays=new Set(allComp).size;
  const totalCheckins=allComp.length;

  let html=`<div class="stats-grid">
    <div class="stat-card"><div class="value">${data.habits.length}</div><div class="label">Habits</div></div>
    <div class="stat-card"><div class="value">${totalCheckins}</div><div class="label">Total Check-ins</div></div>
    <div class="stat-card"><div class="value">${uniqueDays}</div><div class="label">Active Days</div></div>
  </div><div class="habit-stats">`;

  data.habits.forEach(h=>{
    const streak=getStreak(h.id);
    const longest=getLongestStreak(h.id);
    const comp=data.completions[h.id]||[];
    const week7=last7(h.id);
    const month30=last30(h.id);
    html+=`<div class="habit-stat-row">
      <div class="top"><span>${h.emoji}</span><span class="name">${esc(h.name)}</span><button class="delete-btn" onclick="deleteHabit('${h.id}')">×</button></div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;font-size:.85rem">
        <div>🔥 Current: <strong>${streak}</strong></div>
        <div>🏆 Longest: <strong>${longest}</strong></div>
        <div>7d: <strong>${week7}%</strong></div>
        <div>30d: <strong>${month30}%</strong></div>
      </div>
      <div class="progress-bar"><div class="fill" style="width:${month30}%;background:${h.color}"></div></div>
      <div style="margin-top:8px">${MILESTONES.map(m=>`<span class="milestone${longest>=m.d?' achieved':''}">${m.l}</span>`).join('')}</div>
    </div>`;
  });
  html+='</div>';
  container.innerHTML=html;
}

function last7(id){const comp=data.completions[id]||[];let c=0;const t=today();let d=t;for(let i=0;i<7;i++){if(comp.includes(d))c++;d=dayBefore(d)}return Math.round(c/7*100)}
function last30(id){const comp=data.completions[id]||[];let c=0;let d=today();for(let i=0;i<30;i++){if(comp.includes(d))c++;d=dayBefore(d)}return Math.round(c/30*100)}

// Modal
function openAddModal(){editId=null;document.getElementById('modalTitle').textContent='Add Habit';document.getElementById('habitName').value='';selectedEmoji=EMOJIS[0];selectedColor=COLORS[0];renderEmojiPicker();renderColorPicker();document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}

function renderEmojiPicker(){
  document.getElementById('emojiPicker').innerHTML=EMOJIS.map(e=>`<span class="emoji-opt${e===selectedEmoji?' selected':''}" onclick="selectEmoji('${e}')">${e}</span>`).join('');
}
function selectEmoji(e){selectedEmoji=e;renderEmojiPicker()}

function renderColorPicker(){
  document.getElementById('colorPicker').innerHTML=COLORS.map(c=>`<div class="color-opt${c===selectedColor?' selected':''}" style="background:${c}" onclick="selectColor('${c}')"></div>`).join('');
}
function selectColor(c){selectedColor=c;renderColorPicker()}

function saveHabit(){
  const name=document.getElementById('habitName').value.trim();
  if(!name)return;
  const freq=document.getElementById('habitFreq').value;
  const habit={id:editId||Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,emoji:selectedEmoji,color:selectedColor,frequency:freq,created:today()};
  if(editId){const i=data.habits.findIndex(h=>h.id===editId);if(i>=0)data.habits[i]=habit}
  else data.habits.push(habit);
  if(!data.completions[habit.id])data.completions[habit.id]=[];
  save();closeModal();renderToday();
}

function deleteHabit(id){if(!confirm('Delete this habit?'))return;data.habits=data.habits.filter(h=>h.id!==id);delete data.completions[id];save();renderToday();renderStats()}

function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='habits-backup.json';a.click();
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.habits&&d.completions){data=d;save();renderToday();alert('Imported!')}}catch(e){alert('Invalid file')}};r.readAsText(f);
  e.target.value='';
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal()});

// Init
load();renderToday();
</script>
