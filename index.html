<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habits — Daily Streak Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--green1:#0e4429;--green2:#006d32;--green3:#26a641;--green4:#39d353;--accent:#58a6ff;--danger:#f85149;--check:#39d353}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;max-width:720px;margin:0 auto}
h1{font-size:1.4rem;font-weight:600;margin-bottom:4px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.header-left{display:flex;align-items:center;gap:10px}
.header-right{display:flex;gap:8px}
button{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:.8rem;transition:background .15s}
button:hover{background:var(--border)}
.btn-primary{background:var(--green3);border-color:var(--green3);color:#fff}
.btn-primary:hover{background:var(--green4)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.subtitle{color:var(--text2);font-size:.85rem}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:90%;max-width:400px}
.modal h2{margin-bottom:16px;font-size:1.1rem}
.modal label{display:block;color:var(--text2);font-size:.8rem;margin-bottom:4px;margin-top:12px}
.modal input[type=text]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-size:.9rem}
.modal input[type=text]:focus{outline:none;border-color:var(--accent)}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.emoji-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;border-radius:6px;background:var(--bg);border:2px solid transparent;cursor:pointer;transition:border-color .15s}
.emoji-btn.selected{border-color:var(--accent)}
.color-grid{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.color-btn{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s}
.color-btn.selected{border-color:#fff;transform:scale(1.2)}
.modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}

/* Habit Card */
.habit-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;transition:border-color .2s}
.habit-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.habit-emoji{font-size:1.4rem;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--bg);flex-shrink:0}
.habit-info{flex:1;min-width:0}
.habit-name{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit-stats{display:flex;gap:12px;color:var(--text2);font-size:.75rem;margin-top:2px}
.streak-fire{color:var(--check);font-weight:700;display:inline-flex;align-items:center;gap:2px}
.streak-fire .fire{display:inline-block;animation:flicker 1s ease-in-out infinite alternate}
@keyframes flicker{0%{transform:scale(1) rotate(-2deg)}100%{transform:scale(1.15) rotate(2deg)}}
.check-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;flex-shrink:0;font-size:1.2rem;color:transparent}
.check-btn.checked{background:var(--check);border-color:var(--check);color:#fff;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.check-btn:active{transform:scale(.9)}

/* Heatmap */
.heatmap{display:flex;gap:2px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.heatmap::-webkit-scrollbar{display:none}
.heatmap-week{display:flex;flex-direction:column;gap:2px}
.heatmap-day{width:10px;height:10px;border-radius:2px;background:var(--surface2)}
.heatmap-day.l1{background:var(--green1)}
.heatmap-day.l2{background:var(--green2)}
.heatmap-day.l3{background:var(--green3)}
.heatmap-day.l4{background:var(--green4)}

/* Habit actions */
.habit-actions{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.habit-actions button{font-size:.7rem;padding:3px 8px}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty .icon{font-size:3rem;margin-bottom:12px}
.empty p{margin-bottom:16px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <h1>🔥 Habits</h1>
    <span class="subtitle">Daily Streak Tracker</span>
  </div>
  <div class="header-right">
    <button onclick="exportData()" title="Export">📤</button>
    <button class="btn-primary" onclick="openModal()">+ Add</button>
  </div>
</div>

<div id="habits-list"></div>

<div id="empty" class="empty" style="display:none">
  <div class="icon">✨</div>
  <p>No habits yet. Start tracking your first habit!</p>
  <button class="btn-primary" onclick="openModal()">+ Add Habit</button>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Add Habit</h2>
    <label>Name</label>
    <input type="text" id="habit-name" placeholder="e.g. Meditate" maxlength="30">
    <label>Emoji</label>
    <div class="emoji-grid" id="emoji-grid"></div>
    <label>Color</label>
    <div class="color-grid" id="color-grid"></div>
    <div class="modal-actions">
      <button onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveHabit()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const EMOJIS = ['💪','🧘','📖','🏃','💧','🎯','✍️','🥗','😴','🧠','🎸','💻','🌅','🙏','💊'];
const COLORS = ['#39d353','#58a6ff','#f78166','#d2a8ff','#ff7b72','#79c0ff','#ffa657','#7ee787','#e6edf3','#f0883e'];
const MAX_HABITS = 10;
const GRID_DAYS = 90;

let habits = JSON.parse(localStorage.getItem('habits') || '[]');
let editingId = null;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function todayStr(){return new Date().toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}

function getStreak(log){
  let d=new Date(),streak=0;
  // check today first
  let ds=d.toISOString().slice(0,10);
  if(!log[ds]){d.setDate(d.getDate()-1)} // if not done today, start from yesterday
  while(true){
    let k=d.toISOString().slice(0,10);
    if(log[k])streak++;else break;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function getBestStreak(log){
  let dates=Object.keys(log).filter(k=>log[k]).sort();
  if(!dates.length)return 0;
  let best=1,cur=1;
  for(let i=1;i<dates.length;i++){
    if(daysBetween(dates[i-1],dates[i])===1)cur++;
    else cur=1;
    if(cur>best)best=cur;
  }
  return best;
}

function getRate(log){
  let count=0,d=new Date();
  for(let i=0;i<30;i++){
    if(log[d.toISOString().slice(0,10)])count++;
    d.setDate(d.getDate()-1);
  }
  return Math.round(count/30*100);
}

function buildHeatmap(log,color){
  let html='';
  // Build grid: 13 weeks × 7 days = 91 days
  let end=new Date();
  let start=new Date(end);
  start.setDate(start.getDate()-GRID_DAYS+1);
  // align to start of week (Sunday)
  let dayOfWeek=start.getDay();
  start.setDate(start.getDate()-dayOfWeek);

  let cur=new Date(start);
  while(cur<=end){
    html+='<div class="heatmap-week">';
    for(let d=0;d<7;d++){
      let ds=cur.toISOString().slice(0,10);
      let level=log[ds]?'l4':'';
      html+=`<div class="heatmap-day ${level}" title="${ds}"></div>`;
      cur.setDate(cur.getDate()+1);
    }
    html+='</div>';
  }
  return html;
}

function render(){
  const list=document.getElementById('habits-list');
  const empty=document.getElementById('empty');
  const active=habits.filter(h=>!h.archived);
  
  if(!active.length){list.innerHTML='';empty.style.display='block';return}
  empty.style.display='none';
  
  let today=todayStr();
  list.innerHTML=active.map(h=>{
    let streak=getStreak(h.log);
    let best=getBestStreak(h.log);
    let rate=getRate(h.log);
    let done=!!h.log[today];
    return `<div class="habit-card">
      <div class="habit-top">
        <div class="habit-emoji">${h.emoji}</div>
        <div class="habit-info">
          <div class="habit-name">${esc(h.name)}</div>
          <div class="habit-stats">
            <span class="streak-fire">${streak>0?'<span class="fire">🔥</span>':''} ${streak}d streak</span>
            <span>Best: ${best}d</span>
            <span>${rate}% / 30d</span>
          </div>
        </div>
        <button class="check-btn ${done?'checked':''}" onclick="toggle('${h.id}')">${done?'✓':''}</button>
      </div>
      <div class="heatmap">${buildHeatmap(h.log,h.color)}</div>
      <div class="habit-actions">
        <button onclick="archiveHabit('${h.id}')">Archive</button>
        <button class="btn-danger" onclick="deleteHabit('${h.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

function esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}

function toggle(id){
  let h=habits.find(x=>x.id===id);
  if(!h)return;
  let today=todayStr();
  if(h.log[today])delete h.log[today];
  else h.log[today]=1;
  save();render();
}

function save(){localStorage.setItem('habits',JSON.stringify(habits))}

// Modal
function openModal(id){
  editingId=id||null;
  document.getElementById('modal-title').textContent=id?'Edit Habit':'Add Habit';
  let h=id?habits.find(x=>x.id===id):null;
  document.getElementById('habit-name').value=h?h.name:'';
  
  // Emoji grid
  let sel=h?h.emoji:EMOJIS[0];
  document.getElementById('emoji-grid').innerHTML=EMOJIS.map(e=>
    `<div class="emoji-btn ${e===sel?'selected':''}" onclick="pickEmoji(this,'${e}')">${e}</div>`
  ).join('');
  
  // Color grid
  let sc=h?h.color:COLORS[0];
  document.getElementById('color-grid').innerHTML=COLORS.map(c=>
    `<div class="color-btn ${c===sc?'selected':''}" style="background:${c}" onclick="pickColor(this,'${c}')"></div>`
  ).join('');
  
  document.getElementById('modal').classList.add('active');
  document.getElementById('habit-name').focus();
}

function closeModal(){document.getElementById('modal').classList.remove('active');editingId=null}

function pickEmoji(el,e){
  document.querySelectorAll('#emoji-grid .emoji-btn').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
}
function pickColor(el,c){
  document.querySelectorAll('#color-grid .color-btn').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
}

function saveHabit(){
  let name=document.getElementById('habit-name').value.trim();
  if(!name){toast('Enter a habit name');return}
  let emoji=document.querySelector('#emoji-grid .selected')?.textContent||'💪';
  let color=document.querySelector('#color-grid .selected')?.style.background||COLORS[0];
  
  if(editingId){
    let h=habits.find(x=>x.id===editingId);
    if(h){h.name=name;h.emoji=emoji;h.color=color}
  }else{
    if(habits.filter(h=>!h.archived).length>=MAX_HABITS){toast('Max 10 habits');return}
    habits.push({id:uid(),name,emoji,color,log:{},archived:false,created:todayStr()});
  }
  save();render();closeModal();toast(editingId?'Updated!':'Habit added!');
}

function deleteHabit(id){
  if(!confirm('Delete this habit and all its data?'))return;
  habits=habits.filter(x=>x.id!==id);
  save();render();toast('Deleted');
}

function archiveHabit(id){
  let h=habits.find(x=>x.id===id);
  if(h){h.archived=true;save();render();toast('Archived')}
}

function exportData(){
  let blob=new Blob([JSON.stringify(habits,null,2)],{type:'application/json'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='habits-'+todayStr()+'.json';
  a.click();
  toast('Exported!');
}

function toast(msg){
  let t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// Close modal on backdrop click
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});

// Keyboard
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

render();
</script>
</body>
</html>
